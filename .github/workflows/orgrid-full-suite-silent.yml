name: Silent full ORGrid Rust regression

on:
  push:
    branches: [chatgpt/orgrid-full-tests-20261126]

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Record full suite results without failure notification
        shell: bash
        run: |
          mkdir -p full-results
          set +e
          cargo test -p gridcraft-engine -p gridcraft-xlsx -p gridcraft-cli -- --nocapture >full-results/tests.log 2>&1
          code="$?"
          echo "$code" >full-results/tests.exit
          echo "Full ORGrid Rust suite exit=$code"
          grep '^test result:' full-results/tests.log | tail -n 20 || true
          tail -n 55 full-results/tests.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: orgrid-full-regression-report
          path: full-results/
          retention-days: 2
