name: Silent ORGrid compiler audit

on:
  push:
    branches: [chatgpt/orgrid-silent-ci-20261126]

permissions:
  contents: read

jobs:
  rust-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Collect compiler and regression results without failing the workflow
        shell: bash
        run: |
          mkdir -p qa-results
          set +e
          cargo check -p gridcraft-engine -p gridcraft-xlsx -p gridcraft-cli >qa-results/check.log 2>&1
          echo "$?" >qa-results/check.exit
          cargo test -p gridcraft-xlsx exact_xf_copy_tests -- --nocapture >qa-results/xfs.log 2>&1
          echo "$?" >qa-results/xfs.exit
          cargo test -p gridcraft-xlsx merge_preservation_tests -- --nocapture >qa-results/merges.log 2>&1
          echo "$?" >qa-results/merges.exit
          cargo test -p gridcraft-xlsx cell_removal_roundtrip_tests -- --nocapture >qa-results/deletions.log 2>&1
          echo "$?" >qa-results/deletions.exit
          cargo test -p gridcraft-xlsx formula_cache_preservation_tests -- --nocapture >qa-results/caches.log 2>&1
          echo "$?" >qa-results/caches.exit
          cargo test -p gridcraft-engine imported_excel_edit_persists_recalculated_numeric_formula_results -- --nocapture >qa-results/cache_engine.log 2>&1
          echo "$?" >qa-results/cache_engine.exit
          cargo test -p gridcraft-xlsx row_metadata_patch_tests -- --nocapture >qa-results/rows.log 2>&1
          echo "$?" >qa-results/rows.exit
          cargo test -p gridcraft-engine undo_after_save -- --nocapture >qa-results/undo.log 2>&1
          echo "$?" >qa-results/undo.exit
          cargo test -p gridcraft-engine undo_and_redo -- --nocapture >qa-results/undo_redo.log 2>&1
          echo "$?" >qa-results/undo_redo.exit
          for name in check xfs merges deletions caches cache_engine rows undo undo_redo; do
            echo "$name exit=$(cat qa-results/$name.exit)"
            tail -n 15 "qa-results/$name.log"
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: orgrid-silent-audit-results
          path: qa-results/
          retention-days: 2

  linux-qa-executable:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Compile standalone CLI without failing GitHub notification status
        shell: bash
        run: |
          mkdir -p qa-binary
          set +e
          cargo build -p gridcraft-cli >qa-binary/build.log 2>&1
          echo "$?" >qa-binary/build.exit
          if test -f target/debug/gridcraft-cli; then cp target/debug/gridcraft-cli qa-binary/; fi
          echo "CLI build exit=$(cat qa-binary/build.exit)"
          tail -n 30 qa-binary/build.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: orgrid-latest-linux-cli
          path: qa-binary/
          retention-days: 2

  macos-preview:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Package preview Apple Silicon DMG with result recording
        shell: bash
        run: |
          mkdir -p qa-mac
          set +e
          bash packaging/macos/package.sh --arch aarch64 >qa-mac/build.log 2>&1
          echo "$?" >qa-mac/build.exit
          cp dist/release/*aarch64.dmg qa-mac/ 2>/dev/null || true
          echo "Mac package build exit=$(cat qa-mac/build.exit)"
          tail -n 30 qa-mac/build.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: orgrid-latest-macos-preview
          path: qa-mac/
          retention-days: 3
