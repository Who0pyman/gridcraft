name: ORGrid workbook preservation

on:
  pull_request:
    branches: [orgrid-main]
  push:
    branches: [chatgpt/protect-xlsm-workbooks]
  workflow_dispatch:

jobs:
  excel-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Engine workbook protection regression
        run: cargo test -p gridcraft-engine macro_enabled_workbook -- --nocapture
      - name: Preserve imported XLSX templates
        run: cargo test -p gridcraft-engine imported_xlsx -- --nocapture
      - name: Shared-formula normalization regressions
        run: cargo test -p gridcraft-xlsx shared_formula_edit_tests -- --nocapture
      - name: CLI workbook regression
        run: cargo test -p gridcraft-cli --test cli -- --nocapture
      - name: Build GridCraft CLI for package preservation QA
        run: cargo build -p gridcraft-cli
      - name: Synthetic macro-enabled Excel end-to-end smoke test
        run: python3 tools/orgrid_xlsm_smoke.py target/debug/gridcraft-cli
      - name: Export compiled QA CLI for local confidential workbook verification
        uses: actions/upload-artifact@v4
        with:
          name: orgrid-linux-qa-cli
          path: target/debug/gridcraft-cli
          if-no-files-found: error
          retention-days: 2

  macos-preview:
    needs: excel-preservation
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build ad-hoc signed Apple Silicon test installer
        run: bash packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: orgrid-macos-aarch64-preview
          path: dist/release/gridcraft-0.4.0-macos-aarch64.dmg
          if-no-files-found: error
          retention-days: 14
